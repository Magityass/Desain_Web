<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .smartphone {
                display: none;
            }
            @media only screen and (max-width: 428px) {
                body {
                    background-color: yellow;
                }
                .smartphone {
                    display: block;
                }
            }

            .pc {
                display: none;
            }

            @media only screen and (min-width: 1024px) {
                .pc {
                    display: block;
                }
            }
        </style>
    </head>
    <body>
        <h3>Menggunakan Media Queery CSS 3</h3>
        <div class="smartphone">
            <h2>Terdeteksi Ukuran smartphone</h2>
        </div>
        <div class="pc">
            <h2>Terdeteksi ukuran layar > 1024px</h2>
            <img src="UNS.png" alt="Logo" width="50%" height="50%"/>
        </div>
    </body>
</html>
